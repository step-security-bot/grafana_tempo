# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      opentelemetry-otel:
        patterns:
          - go.opentelemetry.io/otel/*
      opentelemetry-contrib:
        patterns:
          - go.opentelemetry.io/contrib/*
          - github.com/open-telemetry/opentelemetry-collector-contrib/*
      opentelemetry-collector:
        patterns:
          - go.opentelemetry.io/collector/*
      k8s.io:
        patterns:
          - k8s.io/*

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'github-actions'
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: docker
    directory: /cmd/tempo-cli
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /cmd/tempo-query
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /cmd/tempo-vulture
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /cmd/tempo
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /tools
    schedule:
      interval: daily

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /vendor/github.com/go-redis/redis/v8
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /vendor/github.com/pelletier/go-toml/v2
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /vendor/go.opentelemetry.io/otel
    schedule:
      interval: daily
